<!-- Code borrowed from W3 schools to implement a form -->
<h1> Contact Us </h1>
<div class = "contact">
    <img class="fit-picture"
        src="static/img/remyinhat.jpeg" />
        <form class="contact-form">
            <label for="fname">First Name:</label> 
            <input type="text" id="fname" name="fname"> <br><br>
        
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname"> <br><br>
        
            <label for="user-message">Your Message:</label> <br><br>
            <textarea id="user-message" name="feedback" rows="5"
              placeholder="Type your message here..." required></textarea> <br><br>
        
            <button type="submit">Submit</button>
          </form>
</div>
