<html>
    <head>
        <title>About This Page</title>
        <link rel = "stylesheet" href = "static/css/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
        <script src="static/js/main.js"></script>
        <meta name="viewport" content="width=device-width">
    </head>

    <body class="light-mode">
        <header class="navbar">
            <!-- need to make header shrink to just menu + search as scroll -->

            <!-- Hamburger Button -->
            <div class="dropdown">
                <!-- Dark & Light Mode Button -->
                <!--<button id="theme-toggle" onclick="switchBgMode()">View</button>-->
                <div class="theme-toggle">
                    <label class="switch" for="switch">
                    <input id="switch" type="checkbox" class="circle" onclick="switchBgMode()"/>
                    <svg
                        viewBox="0 0 384 512"
                        xmlns="http://www.w3.org/2000/svg"
                        class="moon svg" >
                        !Font Awesome Free 6.5.1 by @fontawesome - https://fontawesome.com License
                        - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.
                        <path
                        d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"
                        ></path>
                    </svg>
                    <div class="sun svg">
                        <span class="dot"></span>
                    </div>
                    </label>
                </div>
                

                <div id="myDropdown" class="dropdown-content">
                    <a href="chefituphome.html">Home</a>
                    <a href="chefitupabout.html">About</a>
                    <a href="chefitupcontactus.html">Contact Us</a>
                </div>
                <div class="container" onclick="dropdownMenu(this)">
                    <div class="bar1"></div>
                    <div class="bar2"></div>
                    <div class="bar3"></div>
                </div>
            </div>

            <!-- can we make this a button that redirects to home page??? -->
            <!-- Chef It Up logo -->
            <div class="logo">
                <img class="logo" src="static/img/lightremylogo.png" />
                <span class="logo">Chef It Up</span>
            </div>

            <!-- Search Bar -->
            <div class="search">
                <button onclick="searchBar()" class="searchbutton">
                    <img class="search-icon" src="static/img/search_button.png">
                </button>
                <input class="searchbar" type="text" placeholder="Search...">
            </div>
        </header>

        <h1>Search All Recipes</h1>
        <form class="flex-form" id="search" action="/search" method="POST">
            <div class="form-item">
                <input id="search-bar" name="search-bar" size="40" maxlength="10000" placeholder="Search all recipes...">
            </div>
            <div class="form-item">
                <input type="submit" value="Search" />
            </div>
        </form>

        <h1>Filter Recipes</h1>
        <form class="flex-form" id="search" action="/filter" method="POST">
            <div class="form-item">
                <label for="filter-by">Filter By: </label>
                <select id="filter-by" name="filter-by">
                    <option value="minutes">Time</option>
                    <option value="tags">Meal</option>
                    <option value="name">Recipe Name</option>
                    <option value="ingredients">Ingredient</option>
                </select>
            </div>

            <div class="form-item">
                <label for="vegetarian">Are you Vegetarian? </label>
                <input type="checkbox" name="diet" id="vegetarian">
            </div>

            <div class="form-item">
                <label for="vegan">Are you Vegan?</label>
                <input type="checkbox" name="diet" id="vegan ">
            </div>
        </form>

    </body>
</html>
